<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>授权回调</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; background: #fff; }
  code { display: block; word-break: break-all; background: #f3f3f3; padding: 12px; border-radius: 6px; margin: 12px 0; }
  button { padding: 8px 16px; font-size: 16px; }
  .err { color: #c00; }
</style>
</head>
<body>
<h2>特斯拉授权回调</h2>
<div id="out">读取中…</div>
<p style="color:#666;font-size:14px">本页只在你的浏览器里显示授权码，不会发送到任何地方。授权码几分钟内有效、只能用一次。</p>
<script>
  // 只读取地址栏参数并显示，不发起任何网络请求
  const q = new URLSearchParams(location.search);
  const out = document.getElementById("out");
  const code = q.get("code"), err = q.get("error");
  if (code) {
    out.innerHTML = '<p>授权成功。复制下面的授权码，到服务器上运行 <b>python3 auth.py exchange</b> 后粘贴：</p><code id="c"></code><button id="b">复制</button>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = () => navigator.clipboard.writeText(code).then(() => { document.getElementById("b").textContent = "已复制"; });
  } else {
    out.innerHTML = '<p class="err"></p>';
    out.firstChild.textContent = err ? ("授权失败：" + err + " " + (q.get("error_description") || "")) : "地址栏里没有授权码。";
  }
</script>
</body>
</html>
